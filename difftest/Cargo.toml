# Differential test of the engine against the published 2.0.2.
#
# Not part of the `seesaw-tgg` package and not published: the crate
# depends on two versions of the engine at once, the one in this
# repository and the release it is compared with.
#
#   cd difftest && cargo test --release
[package]
name = "seesaw-difftest"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The engine of this repository.
new = { package = "seesaw-tgg", path = ".." }
# The release it has to agree with.
old = { package = "seesaw-tgg", version = "=2.0.2" }

# The switches of the engine of this repository (branch `perf/options`),
# passed on. With `opt_j` the drivers seed through `seed_with_threads`,
# with `opt_b` they give graph and engine a capacity hint.
[features]
opt_a = ["new/opt_a"]
opt_b = ["new/opt_b"]
opt_c = ["new/opt_c"]
opt_d = ["new/opt_d"]
opt_e = ["new/opt_e"]
opt_f = ["new/opt_f"]
opt_g = ["new/opt_g"]
opt_h = ["new/opt_h"]
opt_i = ["new/opt_i"]
opt_j = ["new/opt_j"]
opt_all = [
    "opt_a", "opt_b", "opt_c", "opt_d", "opt_e",
    "opt_f", "opt_g", "opt_h", "opt_i", "opt_j",
]

[dev-dependencies]
proptest = "1.5"
serde_json = "1.0"

# Keeps this crate out of a workspace a parent directory may define.
[workspace]
