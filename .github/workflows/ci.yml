name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --verbose
      - name: cargo test
        run: cargo test --verbose
      - name: cargo test --examples
        run: cargo test --examples --verbose
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        if: matrix.rust == 'stable'

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

# crates.io-Publishing erfolgt manuell aus dem lokalen master via
# `cargo publish` (siehe RELEASE.md). Kein CI-Job für publish, weil das
# explizite manuelle Trigger-Modell mit lokaler Token-Verwaltung sicherer
# ist als Token-Speicherung in GitHub-Secrets.
