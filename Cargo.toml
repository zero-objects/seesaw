[package]
name = "seesaw-tgg"
description = "Bidirectional graph transformation with a declarative rule format: value-free structural identity, delta-local cascade, no negative application conditions."
version = "2.0.2"
edition = "2021"
authors = ["Zero Principle <hello@zero-principle.org>"]
license = "Apache-2.0"
repository = "https://github.com/zero-objects/seesaw"
homepage = "https://github.com/zero-objects/seesaw"
documentation = "https://docs.rs/seesaw-tgg"
readme = "README.md"
keywords = ["tgg", "graph", "model-transformation", "bidirectional", "cascade"]
categories = ["data-structures", "algorithms", "science"]
# The Java implementation lives in the repository, not in the crate:
# it reads the same rule files but is built and released separately.
exclude = ["java/", ".github/", "proofs/"]

[dependencies]
# blake3 rather than SHA-256 for identities: collision resistant, so the
# structural identity contract holds, and SIMD accelerated without a
# software crypto fallback.
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
regex = "1.11"

[dev-dependencies]
proptest = "1.5"
# User CPU time and peak memory of the performance suite (`getrusage`).
libc = "0.2"

# The performance suite: one cell (workload, operation, size) per
# process, see `benches/suite/main.rs`.
[[bench]]
name = "suite"
harness = false

# `--cfg seesaw_checks` compiles the engine's checks of the delta-local
# expansion and of the seed against the unfiltered search into the
# library, as a test build of the library has them. With it the
# integration tests in `tests/` run under those checks:
#   RUSTFLAGS="--cfg seesaw_checks" cargo test
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(seesaw_checks)'] }

[features]
# Deterministic structural counters for the cascade, for diagnostics.
# Off by default, no effect on the hot path.
perf_trace = []

# Switches of the performance work on the branch `perf/options`. Each
# selects another implementation of one internal structure, none
# changes what the engine does (graph, cascade and its order, results
# of `step`, `saw_contradiction`, verdicts of `run`). They exist so
# that combinations can be measured, and go once the selection is made.
# Links of a match are not filed in `by_element`; the matches of a
# removed connection are found from its two ends.
opt_a = []
# Capacity hints: `Graph::reserve`, `Engine::reserve`.
opt_b = []
# The graph map holds an index into dense vectors of nodes and
# connections.
opt_c = []
# The todo is a heap.
opt_d = []
# The todo key carries the number of the match: one lookup per step.
opt_e = []
# Equals predicates compare the ids of values, not their strings.
opt_f = []
# The type ids of a rule are resolved once per graph, not per step.
opt_g = []
# `Ixs` in 16 bytes.
opt_h = []
# The anchor index of a rule set is shared within the process.
opt_i = []
# The search of the seed runs on several threads.
opt_j = []
# The walk over the anchor index passes once over the participation
# list of a node where the prefix-tree node has many groups.
opt_m = []
opt_all = [
    "opt_a", "opt_b", "opt_c", "opt_d", "opt_e",
    "opt_f", "opt_g", "opt_h", "opt_i", "opt_j",
    "opt_m",
]
