[package]
name = "seesaw-tgg"
description = "Delta-extended Triple Graph Grammar engine with rank-based backtracking: graph, ops, cascade, fold."
version = "1.0.0"
edition = "2021"
authors = ["Zero Principle <hello@zero-principle.org>"]
license = "Apache-2.0"
repository = "https://github.com/zero-objects/seesaw"
homepage = "https://github.com/zero-objects/seesaw"
documentation = "https://docs.rs/seesaw-tgg"
readme = "README.md"
keywords = ["tgg", "graph", "model-transformation", "bidirectional", "cascade"]
categories = ["data-structures", "algorithms", "science"]

[dependencies]
petgraph = { version = "0.6", features = ["serde-1"] }
# rc10: blake3 instead of SHA-256 for GhostIds — cryptographically
# collision-resistant (the structural identity contract of Def. 5.3 holds),
# but SIMD-accelerated and without sha2's software-crypto fallback.
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }
regex = "1.11"

[dev-dependencies]
proptest = "1.5"

[features]
regen_graphs = []
# Deterministic structural counters for the cascade (perf diagnostics).
# Off by default → no effect on the hot path.
perf_trace = []

[[example]]
name = "basic_cascade"
path = "examples/basic_cascade.rs"
