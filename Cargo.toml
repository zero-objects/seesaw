[package]
name = "seesaw-tgg"
description = "Bidirectional graph transformation with a declarative rule format: value-free structural identity, delta-local cascade, no negative application conditions."
version = "2.0.1"
edition = "2021"
authors = ["Zero Principle <hello@zero-principle.org>"]
license = "Apache-2.0"
repository = "https://github.com/zero-objects/seesaw"
homepage = "https://github.com/zero-objects/seesaw"
documentation = "https://docs.rs/seesaw-tgg"
readme = "README.md"
keywords = ["tgg", "graph", "model-transformation", "bidirectional", "cascade"]
categories = ["data-structures", "algorithms", "science"]
# The Java implementation lives in the repository, not in the crate:
# it reads the same rule files but is built and released separately.
exclude = ["java/", ".github/"]

[dependencies]
# blake3 rather than SHA-256 for identities: collision resistant, so the
# structural identity contract holds, and SIMD accelerated without a
# software crypto fallback.
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
regex = "1.11"

[dev-dependencies]
proptest = "1.5"

[features]
# Deterministic structural counters for the cascade, for diagnostics.
# Off by default, no effect on the hot path.
perf_trace = []
