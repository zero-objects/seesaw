[package]
name = "seesaw-tgg"
description = "Bidirectional graph transformation with a declarative rule format: value-free structural identity, delta-local cascade, no negative application conditions."
version = "2.0.2"
edition = "2021"
authors = ["Zero Principle <hello@zero-principle.org>"]
license = "Apache-2.0"
repository = "https://github.com/zero-objects/seesaw"
homepage = "https://github.com/zero-objects/seesaw"
documentation = "https://docs.rs/seesaw-tgg"
readme = "README.md"
keywords = ["tgg", "graph", "model-transformation", "bidirectional", "cascade"]
categories = ["data-structures", "algorithms", "science"]
# The Java implementation lives in the repository, not in the crate:
# it reads the same rule files but is built and released separately.
exclude = ["java/", ".github/", "proofs/"]

[dependencies]
# blake3 rather than SHA-256 for identities: collision resistant, so the
# structural identity contract holds, and SIMD accelerated without a
# software crypto fallback.
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
regex = "1.11"

[dev-dependencies]
proptest = "1.5"
# User CPU time and peak memory of the performance suite (`getrusage`).
libc = "0.2"

# The performance suite: one cell (workload, operation, size) per
# process, see `benches/suite/main.rs`.
[[bench]]
name = "suite"
harness = false

# `--cfg seesaw_checks` compiles the engine's checks of the delta-local
# expansion and of the seed against the unfiltered search into the
# library, as a test build of the library has them. With it the
# integration tests in `tests/` run under those checks:
#   RUSTFLAGS="--cfg seesaw_checks" cargo test
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(seesaw_checks)'] }

[features]
# Deterministic structural counters for the cascade, for diagnostics.
# Off by default, no effect on the hot path.
perf_trace = []

# Less memory for more work. The graph keeps its nodes and connections
# in dense vectors behind a map of numbers, and the engine keeps its
# lists of indices per element in 16 bytes instead of 32. Measured on
# the performance suite: 17 to 24 % less peak memory in four of five
# large cells (1 % in the fifth), up to 4 % more instructions (6 to
# 8 % where a run deletes). Time on a machine under load: 7 to 9 %
# more on the two recorded host runs, no difference beyond the noise
# on the generated workloads.
# Graph, cascade and verdicts are the same with and without it.
low_memory = []

# `Engine::seed_with_threads`: the searches of a seed on several
# threads, the matches recorded in the order of `Engine::seed`. Not on
# wasm32.
parallel_seed = []
